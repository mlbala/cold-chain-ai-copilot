name: Deploy to EC2

# Manual or release-tag deploys only: pushing branches never touches production.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CONTAINER_NAME: cold-chain-copilot
  APP_PORT: "8000"

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 for t3.micro)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy to EC2 t3.micro
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Pull and restart container on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          ENV_FILE: ${{ vars.EC2_ENV_FILE || '/opt/cold-chain-copilot/.env' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,CONTAINER_NAME,APP_PORT,ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p "${APP_PORT}:8000" \
              --memory 700m \
              --log-opt max-size=20m --log-opt max-file=3 \
              "$IMAGE"
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health" >/dev/null; then
                echo "Deployed $IMAGE (healthy after ${attempt} checks)"
                docker image prune -af --filter "until=168h" >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "Container failed its health check" >&2
            docker logs --tail 100 "$CONTAINER_NAME" >&2
            exit 1
