name: Deploy to EC2

# Manual or release-tag deploys only: pushing branches never touches production.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CONTAINER_NAME: cold-chain-copilot
  APP_PORT: "8000"

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 for t3.micro)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy to EC2 t3.micro
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      # A t3.micro has 1 GB of RAM. The container is capped at 700 MB, and the host also runs
      # Docker and the OS, so a 2 GB swap file prevents OOM kills during pulls and spikes.
      - name: Ensure 2 GB swap on the t3.micro
        uses: appleboy/ssh-action@v1.2.0
        env:
          REQUIRED_SWAP_MB: "2048"
          ENSURE_SWAP: ${{ vars.EC2_ENSURE_SWAP || 'true' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REQUIRED_SWAP_MB,ENSURE_SWAP
          script_stop: true
          script: |
            set -euo pipefail
            swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
            echo "Memory before:"; free -m
            if [ "${swap_mb:-0}" -ge "$REQUIRED_SWAP_MB" ]; then
              echo "Swap OK: ${swap_mb} MB >= ${REQUIRED_SWAP_MB} MB"
              exit 0
            fi
            if [ "$ENSURE_SWAP" != "true" ]; then
              echo "Swap is ${swap_mb} MB, below ${REQUIRED_SWAP_MB} MB, and EC2_ENSURE_SWAP=false." >&2
              echo "Provision swap on the instance or allow this job to do it." >&2
              exit 1
            fi
            sudo -n true 2>/dev/null || { echo "Passwordless sudo is required to provision swap" >&2; exit 1; }
            free_disk_mb=$(df -Pm / | awk 'NR==2 {print $4}')
            if [ "$free_disk_mb" -lt 3072 ]; then
              echo "Only ${free_disk_mb} MB free on /; need 3 GB to add a 2 GB swap file" >&2
              exit 1
            fi
            echo "Provisioning a ${REQUIRED_SWAP_MB} MB /swapfile (was ${swap_mb} MB swap)"
            sudo swapoff /swapfile 2>/dev/null || true
            sudo fallocate -l "${REQUIRED_SWAP_MB}M" /swapfile \
              || sudo dd if=/dev/zero of=/swapfile bs=1M count="$REQUIRED_SWAP_MB" status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile >/dev/null
            sudo swapon /swapfile
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
            echo 'vm.swappiness=10' | sudo tee /etc/sysctl.d/99-cold-chain-swap.conf >/dev/null
            sudo sysctl -q -p /etc/sysctl.d/99-cold-chain-swap.conf
            swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
            echo "Memory after:"; free -m
            [ "$swap_mb" -ge "$REQUIRED_SWAP_MB" ] || { echo "Swap still ${swap_mb} MB" >&2; exit 1; }

      - name: Pull and restart container on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          ENV_FILE: ${{ vars.EC2_ENV_FILE || '/opt/cold-chain-copilot/.env' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,CONTAINER_NAME,APP_PORT,ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p "${APP_PORT}:8000" \
              --memory 700m --memory-swap 1500m \
              --log-opt max-size=20m --log-opt max-file=3 \
              "$IMAGE"
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health" >/dev/null; then
                echo "Deployed $IMAGE (healthy after ${attempt} checks)"
                docker image prune -af --filter "until=168h" >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "Container failed its health check" >&2
            docker logs --tail 100 "$CONTAINER_NAME" >&2
            exit 1
